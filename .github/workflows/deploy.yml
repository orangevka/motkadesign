name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      target:
        description: 'Which site to deploy (en / ru / both)'
        required: false
        default: 'both'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      en: ${{ steps.check.outputs.en }}
      ru: ${{ steps.check.outputs.ru }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "en=true" >> $GITHUB_OUTPUT
            echo "ru=true" >> $GITHUB_OUTPUT
          else
            EN=$(git diff --name-only HEAD~1 HEAD | grep -q '^webflow-export/' && echo true || echo false)
            RU=$(git diff --name-only HEAD~1 HEAD | grep -q '^webflow-export-ru/' && echo true || echo false)
            echo "en=$EN" >> $GITHUB_OUTPUT
            echo "ru=$RU" >> $GITHUB_OUTPUT
          fi

  deploy-en:
    name: Deploy EN → motka-rix.erra.net
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.en == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'en' || github.event.inputs.target == 'both')))
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: webflow-export/
          remote_path: /var/www/motka-rix.erra.net/
          remote_host: 213.21.222.128
          remote_user: motka
          remote_key: ${{ secrets.DEPLOY_KEY }}

  deploy-ru:
    name: Deploy RU → new.motka.ru
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.ru == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'ru' || github.event.inputs.target == 'both')))
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: webflow-export-ru/
          remote_path: /var/www/new.motka.ru/motka-mirror/motka-ru.webflow.io/
          remote_host: 176.53.146.40
          remote_user: motka
          remote_key: ${{ secrets.DEPLOY_KEY_RU }}
